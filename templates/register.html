{% extends "base.html" %}
{% block title %}Sign Up — CropSense{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus-fill display-5 text-success"></i>
          <h2 class="fw-bold mt-2">Create Account</h2>
          <p class="text-muted">Join CropSense for free</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control" placeholder="Your name" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 fw-semibold py-2">
            <i class="bi bi-check-circle me-2"></i>Create Account
          </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted mb-0">
          Already have an account? <a href="{{ url_for('login') }}" class="text-success fw-semibold">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
